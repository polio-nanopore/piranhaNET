name: Piranha Web
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'piranha-apps/**'
      - '.github/workflows/**'

defaults:
  run:
    working-directory: ./piranha-apps

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: piranha-apps/.nvmrc
          cache: npm
          cache-dependency-path: piranha-apps/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build-web
      - name: Make test-results dir
        run: mkdir -p ../test-results
      - name: Run API
        run: ./scripts/build-and-run-docker-dev
        working-directory: ./piranha-api
      - name: Run Web
        run: nohup ./start-server.sh > /dev/null 2>&1 &
      - name: E2e test
        run: npm run test-web:e2e
      - name: Upload e2e error snapshots
        if: always() && hashFiles('piranha-apps/test-results') != ''
        uses: actions/upload-artifact@v7
        with:
          name: Web e2e error snapshots
          path: piranha-apps/test-results