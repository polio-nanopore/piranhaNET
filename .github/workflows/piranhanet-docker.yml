name: Build and Push PiranhaNET Docker Images
on:
  push:
    branches:
      - main
  pull_request:
env:
  REGISTRY: ghcr.io
  ORG_NAME: ${{ github.organization }}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: ./piranha-api/Dockerfile
            context: ./piranha-api
            image_name: piranhanet-api
          - dockerfile: ./piranha-apps/Dockerfile
            context: ./piranha-apps
            image_tag: piranhanet-web
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/${{ matrix.image_name }}:${{ github.ref_name }}