name: Test and Publish PiranhaNET Docker Images
on:
  push:
    branches:
      - main
  release:
    types: [ published ]
  pull_request:
env:
  REGISTRY: ghcr.io
  ORG_NAME: ${{ github.repository_owner}}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install the project
        run: uv sync --locked
        working-directory: piranha-api
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: piranha-apps/.nvmrc
          cache: npm
          cache-dependency-path: piranha-apps/package-lock.json
      - name: Install Node dependencies
        run: npm ci
        working-directory: piranha-apps
      - name: Build and run API container
        run: ./scripts/build-and-run-docker-dev
        working-directory: piranha-api
      - name: Build and run web container
        run: ./scripts/build-and-run-docker-dev
        working-directory: piranha-apps
      - name: Install Playwright
        run: npx playwright install
        working-directory: piranha-apps
      - name: Test running containers
        run: npx playwright test --project=web-smoke
        working-directory: piranha-apps
  publish:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - dockerfile: ./piranha-api/Dockerfile
            context: ./piranha-api
            image_name: piranhanet-api
          - dockerfile: ./piranha-apps/Dockerfile
            context: ./piranha-apps
            image_name: piranhanet-web
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/${{ matrix.image_name }}:${{ github.head_ref || github.ref_name }}