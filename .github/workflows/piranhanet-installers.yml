name: PiranhaNET Installers
on:
  push:
    branches: [ mrc-6956-piranha-image-installer ]
  release:
    types: [created]
  workflow_dispatch: # can run manually for testing without a release
jobs:
  pull-and-tar-piranha-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./piranha-apps
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.9
          cache: npm
          cache-dependency-path: piranha-apps/package-lock.json
      - name: Pull and tar piranha docker image
        run: npm run docker:pull-and-tar-piranha
      - name: Upload piranha docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: piranha-docker-image
          path: piranha-apps/installer-resources/piranha-docker-image.tar
          if-no-files-found: error
  build-win:
    runs-on: windows-latest
    needs: pull-and-tar-piranha-image
    defaults:
      run:
        shell: bash
        working-directory: ./piranha-apps
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.9
          cache: npm
          cache-dependency-path: piranha-apps/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build electron app
        run: npm run build-electron
      - name: Make installer-resources dir
        run: mkdir installer-resources
      - name: Download piranha docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: piranha-docker-image
          path: ./piranha-apps/installer-resources
      - name: Verify tar
        run: ls -la installer-resources
      - name: Build full installer
        run: npm run build-installer:win-full
      - name: Build light installer
        run: npm run build-installer:win-light
      - name: Add installers to release (if there is one)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: piranha-apps/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts (if manual workflow run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: piranhanet-windows-installer-${{ github.run_number }}
          path: piranha-apps/dist/*.exe
          retention-days: 10
  
